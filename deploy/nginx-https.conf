server {
    listen 80;
    listen [::]:80;
    server_name effective.omfreight.vip;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/freight-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://effective.omfreight.vip$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name effective.omfreight.vip;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/effective.omfreight.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/effective.omfreight.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FreightAdminTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1m;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    access_log /var/log/nginx/freight-admin.access.log;
    error_log /var/log/nginx/freight-admin.error.log;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_hide_header Strict-Transport-Security;
    }
}
